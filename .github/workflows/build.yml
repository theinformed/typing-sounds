# build.yml -- compile and check the app; publish packages on version tags.
# Created by LT Sean Egan, PhD 2026-10-15
name: Build macOS app
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install audio conversion tool
        run: brew install ffmpeg
      - name: Build and package
        run: ./release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Typing-Sounds-apple-silicon
          path: dist/*
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" dist/* --title "Typing Sounds $GITHUB_REF_NAME" --generate-notes
          fi
